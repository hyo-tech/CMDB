x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  cmdb:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/itom:2.0.0.296
    logging: *default-logging
    restart: unless-stopped
    environment:
      PORT: 8443
      NODE_ENV: production
      TRANSPORTER: nats://nats:4222
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY}
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      HOST: ${HOST}
      WEBSECURE_PORT: ${WEBSECURE_PORT}
      SERVICEDIR: services
      SERVICES: query-definition,class-model,tql-engine,normalization-engine,datain,multi-tenant,export,dashboard-engine,settings-engine,search-engine,license-service
      CONTEXT_PATH: ${CONTEXT_PATH:-}
      SETTING_GENERAL_TENANT_ENABLED_MODULES: "cmdb,collection-management,api-docs,license-manager"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET: ${KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_SYSADMIN_PASSWORD: ${KEYCLOAK_SYSADMIN_PASSWORD:-Sysadmin_1234}

    depends_on:
        - postgres
    labels:
      - "traefik.enable=true"
      # 1. Bearer Token 路由（优先级高）
      - "traefik.http.routers.cmdb-bearer.rule=PathRegexp(`${CONTEXT_PATH:-}/cmdb`) && HeaderRegexp(`Authorization`, `^Bearer .+`)"
      - "traefik.http.routers.cmdb-bearer.priority=20"
      - "traefik.http.routers.cmdb-bearer.service=cmdb"
      - "traefik.http.routers.cmdb-bearer.tls=true"
      - "traefik.http.routers.cmdb-bearer.middlewares=strip-context-path"
      - "traefik.http.services.cmdb-bearer.loadbalancer.server.port=8443"
      - "traefik.http.services.cmdb-bearer.loadbalancer.server.scheme=https"

      # 2. 普通（无 Bearer）API 路由，走 oauth2-proxy
      - "traefik.http.routers.cmdb.rule=PathRegexp(`${CONTEXT_PATH:-}/cmdb`)"
      - "traefik.http.routers.cmdb.priority=10"
      - "traefik.http.routers.cmdb.service=cmdb"
      - "traefik.http.routers.cmdb.tls=true"
      - "traefik.http.routers.cmdb.middlewares=oauth2-proxy,strip-context-path"
      - "traefik.http.services.cmdb.loadbalancer.server.port=8443"
      - "traefik.http.services.cmdb.loadbalancer.server.scheme=https"
    volumes:
      - ./conf/certificates:/cmdb/conf/certificates:ro
      - ci-export-data:/cmdb/conf/data/cmdb-ci-export
      - ./logs/cmdb:/cmdb/logs
    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"

  # ─── Merged API Gateway (all public-facing API services in one container) ───
  # Previously separate: cmdb-api, monitoring-api, collection-management-api,
  #                      platform-api, search-api, ai-agent-api
  api:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/itom:2.0.0.296
    logging: *default-logging
    restart: unless-stopped
    environment:
      PORT: 8443
      NODE_ENV: production
      TRANSPORTER: nats://nats:4222
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY}
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      HOST: ${HOST}
      WEBSECURE_PORT: ${WEBSECURE_PORT}
      SERVICEDIR: services
      SERVICES: api
      CONTEXT_PATH: ${CONTEXT_PATH:-}
      SETTING_GENERAL_TENANT_ENABLED_MODULES: "cmdb,collection-management,api-docs,license-manager"
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_SERVICE_ACCOUNT_CLIENT_ID: ${KEYCLOAK_SERVICE_ACCOUNT_CLIENT_ID}
      KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET: ${KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET}
    depends_on:
      - postgres
      - cmdb
      - ai-agent
      - keycloak
    labels:
      - "traefik.enable=true"
      # 共用 strip-prefix 中间件
      - "traefik.http.middlewares.api-strip-prefix.stripprefix.prefixes=${CONTEXT_PATH:-}"

      # 1. 公共认证端点（最高优先级，不走 oauth2-proxy）
      - "traefik.http.routers.api-platform-auth.rule=PathRegexp(`^${CONTEXT_PATH:-}/api/[0-9]+/platform/authenticate`)"
      - "traefik.http.routers.api-platform-auth.priority=30"
      - "traefik.http.routers.api-platform-auth.service=api"
      - "traefik.http.routers.api-platform-auth.tls=true"
      - "traefik.http.routers.api-platform-auth.middlewares=api-strip-prefix"

      # 2. SSE Stream 路由（最高优先级，禁用缓冲）
      - "traefik.http.routers.api-ai-stream.rule=PathRegexp(`^${CONTEXT_PATH:-}/api/[0-9]+/ai-agent/stream`)"
      - "traefik.http.routers.api-ai-stream.priority=30"
      - "traefik.http.routers.api-ai-stream.service=api-stream"
      - "traefik.http.routers.api-ai-stream.tls=true"
      - "traefik.http.routers.api-ai-stream.middlewares=api-strip-prefix"
      - "traefik.http.services.api-stream.loadbalancer.server.port=8443"
      - "traefik.http.services.api-stream.loadbalancer.server.scheme=https"
      - "traefik.http.services.api-stream.loadbalancer.responseforwarding.FlushInterval=1ms"

      # 3. Bearer Token 路由（高优先级）
      - "traefik.http.routers.api-bearer.rule=PathRegexp(`^${CONTEXT_PATH:-}/api/[0-9]+/.*`) && HeaderRegexp(`Authorization`, `^Bearer .+`)"
      - "traefik.http.routers.api-bearer.priority=20"
      - "traefik.http.routers.api-bearer.service=api"
      - "traefik.http.routers.api-bearer.tls=true"
      - "traefik.http.routers.api-bearer.middlewares=api-strip-prefix"

      # 4. 普通 API 路由，走 oauth2-proxy
      - "traefik.http.routers.api.rule=PathRegexp(`^${CONTEXT_PATH:-}/api/[0-9]+/.*`)"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.middlewares=oauth2-proxy,api-strip-prefix"

      # 默认 service 定义
      - "traefik.http.services.api.loadbalancer.server.port=8443"
      - "traefik.http.services.api.loadbalancer.server.scheme=https"
    volumes:
      - ./conf/certificates:/cmdb/conf/certificates:ro
      - ci-export-data:/cmdb/conf/data/cmdb-ci-export
      - ./logs/api:/cmdb/logs
    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"

  ai-agent:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/itom:2.0.0.296
    logging: *default-logging
    restart: unless-stopped
    environment:
      PORT: 8449
      NODE_ENV: production
      TRANSPORTER: nats://nats:4222
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY}
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      HOST: ${HOST}
      WEBSECURE_PORT: ${WEBSECURE_PORT}
      SERVICEDIR: services
      SERVICES: ai-agent
      CONTEXT_PATH: ${CONTEXT_PATH:-}
      SETTING_GENERAL_TENANT_ENABLED_MODULES: "cmdb,collection-management,api-docs,license-manager"
      # AI Model Configuration
      ITOM_MODEL_NAME: ${ITOM_MODEL_NAME:-}
      ITOM_MODEL_BASE_URL: ${ITOM_MODEL_BASE_URL:-}
      ITOM_MODEL_API_KEY: ${ITOM_MODEL_API_KEY:-${OPENAI_API_KEY:-}}
      # 辅助任务模型配置（留空则回退到主模型）
      ITOM_MEMORY_EXTRACT_MODEL: ${ITOM_MEMORY_EXTRACT_MODEL:-}
      ITOM_MEMORY_EXTRACT_BASE_URL: ${ITOM_MEMORY_EXTRACT_BASE_URL:-}
      ITOM_MEMORY_EXTRACT_API_KEY: ${ITOM_MEMORY_EXTRACT_API_KEY:-}
      ITOM_MEMORY_PLANNER_MODEL: ${ITOM_MEMORY_PLANNER_MODEL:-}
      ITOM_MEMORY_PLANNER_BASE_URL: ${ITOM_MEMORY_PLANNER_BASE_URL:-}
      ITOM_MEMORY_PLANNER_API_KEY: ${ITOM_MEMORY_PLANNER_API_KEY:-}
      ITOM_ARTIFACT_ENABLED: ${ITOM_ARTIFACT_ENABLED:-false}
      ITOM_ARTIFACT_MODEL: ${ITOM_ARTIFACT_MODEL:-}
      ITOM_ARTIFACT_BASE_URL: ${ITOM_ARTIFACT_BASE_URL:-}
      ITOM_ARTIFACT_API_KEY: ${ITOM_ARTIFACT_API_KEY:-}
      ITOM_PII_LLM_ENABLED: ${ITOM_PII_LLM_ENABLED:-true}
      ITOM_PII_LLM_MODEL: ${ITOM_PII_LLM_MODEL:-}
      ITOM_PII_LLM_BASE_URL: ${ITOM_PII_LLM_BASE_URL:-}
      ITOM_PII_LLM_API_KEY: ${ITOM_PII_LLM_API_KEY:-}
    depends_on:
        - postgres
        - cmdb
    volumes:
      - ./logs/ai-agent:/cmdb/logs
    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"

  monitoring:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/itom:2.0.0.296
    logging: *default-logging
    restart: unless-stopped
    environment:
      PORT: 8443
      NODE_ENV: production
      TRANSPORTER: nats://nats:4222
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY}
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      DEFAULT_TENANT_ID: 100000001
      HOST: ${HOST}
      WEBSECURE_PORT: ${WEBSECURE_PORT}
      SERVICEDIR: services
      SERVICES: monitoring
      CONTEXT_PATH: ${CONTEXT_PATH:-}
    depends_on:
        - postgres
    labels:
      - "traefik.enable=true"
      # 1. Bearer Token 路由（优先级高）
      - "traefik.http.middlewares.monitoring-bearer-strip-prefix.stripprefix.prefixes=${CONTEXT_PATH:-}"
      - "traefik.http.routers.monitoring-bearer.rule=PathPrefix(`${CONTEXT_PATH:-}/monitoring`) && HeaderRegexp(`Authorization`, `^Bearer .+`)"
      - "traefik.http.routers.monitoring-bearer.priority=20"
      - "traefik.http.routers.monitoring-bearer.service=monitoring"
      - "traefik.http.routers.monitoring-bearer.tls=true"
      - "traefik.http.routers.monitoring-bearer.middlewares=monitoring-bearer-strip-prefix"
      - "traefik.http.services.monitoring-bearer.loadbalancer.server.port=8443"
      - "traefik.http.services.monitoring-bearer.loadbalancer.server.scheme=https"

      # 2. 普通（无 Bearer）monitoring 路由，走 oauth2-proxy
      - "traefik.http.routers.monitoring.rule=PathPrefix(`${CONTEXT_PATH:-}/monitoring`)"
      - "traefik.http.routers.monitoring.priority=10"
      - "traefik.http.routers.monitoring.service=monitoring"
      - "traefik.http.routers.monitoring.tls=true"
      - "traefik.http.routers.monitoring.middlewares=oauth2-proxy"
      - "traefik.http.services.monitoring.loadbalancer.server.port=8443"
      - "traefik.http.services.monitoring.loadbalancer.server.scheme=https"

      # 3. Monitoring WebSocket route (TCP, for proxy connections)
      - "traefik.tcp.routers.monitoring-ws.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.monitoring-ws.entrypoints=monitoring-ws"
      - "traefik.tcp.routers.monitoring-ws.service=monitoring-ws"
      - "traefik.tcp.services.monitoring-ws.loadbalancer.server.port=10052"
    volumes:
      - ./logs/monitoring:/cmdb/logs
    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"

  proxy:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/itom:2.0.0.296
    logging: *default-logging
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: hyo_proxy
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY}
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      HOST: ${HOST}
      CLIENT_ID: DefaultProxy
      WEBSECURE_PORT: ${WEBSECURE_PORT}
      SERVICEDIR: dist
      SERVICE: proxy
      MONITORING_SERVER: monitoring:10052
      WEBDRIVER_URL: ws://browser-agent:3000
      DEVICE_EXECUTOR_URL: http://device-executor:8190
    depends_on:
        - postgres
        - device-executor

    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"
    # Persist + expose the proxy's logs (incl. per-(host,rule) CI-discovery
    # comm logs under logs/<tenant>/comm/) so they survive container restarts
    # and are readable from the host. CMDB_ROOT=/cmdb in the image.
    volumes:
      - ./logs/proxy:/cmdb/logs

  device-executor:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/device-executor:2.0.0.296
    logging: *default-logging
    restart: unless-stopped
    environment:
      - UVICORN_WORKERS=2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8190/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"

  cmdb-ui:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/itom:2.0.0.296
    logging: *default-logging
    environment:
      SERVICES: cmdb-ui
      PORT: 8000
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      HOST: ${HOST}
      WEBSECURE_PORT: ${WEBSECURE_PORT}
      CONTEXT_PATH: ${CONTEXT_PATH:-}
      # CSRF Protection Configuration (BFF Pattern - Centralized at UI Server)
      CSRF_ENABLED: "true"
      CSRF_ALLOWED_ORIGINS: "https://${HOST}:${WEBSECURE_PORT},https://${HOST}"
      CSRF_TOKEN_EXPIRY: "3600"
      CSRF_HEADER_NAME: "X-CSRF-Token"
      CSRF_TOKEN_SECRET: ${CSRF_TOKEN_SECRET:-change-this-to-a-secure-32-byte-secret-key-for-production}
      CSRF_LOG_VIOLATIONS: "true"

    depends_on:
        - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=PathPrefix(`${CONTEXT_PATH:-}/ui`)"
      - "traefik.http.services.ui.loadbalancer.server.port=8000"
      - "traefik.http.routers.ui.tls=true"
      - "traefik.http.routers.ui.service=ui"
      - "traefik.http.services.ui.loadbalancer.server.scheme=https"
      - "traefik.http.routers.ui.middlewares=oauth2-proxy"
    volumes:
      - ./conf/certificates:/cmdb/conf/certificates:ro
      - ./logs/cmdb-ui:/cmdb/logs
    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"

  postgres:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/hyo-product-postgres:2.0.0.8
    logging: *default-logging
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      # 数据库配置
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # 性能配置
      - POSTGRES_MAX_CONNECTIONS=100
      - POSTGRES_SHARED_BUFFERS=512MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=768MB
      - POSTGRES_MAINTENANCE_WORK_MEM=64MB
      - POSTGRES_WORK_MEM=256MB
    volumes:
      - type: bind
        source: ./conf/postgres/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"

  redis:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/vendor/redis:7.2-alpine
    logging: *default-logging
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "${HOST}:host-gateway"

  nats:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/vendor/nats:2.12.6
    logging: *default-logging
    command: ["-c", "/config/nats-server.conf"]
    volumes:
      - ./conf/nats/nats-server.conf:/config/nats-server.conf:ro
      - nats_data:/data
    ports:
      - "4222:4222"
    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  traefik:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/vendor/traefik:3.6.7
    logging: *default-logging
    restart: unless-stopped
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entryPoints.http.address=:80
      - --entryPoints.websecure.address=:443
      - --entryPoints.monitoring-ws.address=:10052
      - --serversTransport.insecureSkipVerify=true
      - "--providers.file.directory=/etc/traefik/config"
      - "--providers.file.watch=true"
      - --log=true
      - --log.filePath=/var/log/traefik/traefik.log
      - --log.format=json
      - --log.level=DEBUG
      - --accesslog=true
      - --accesslog.filePath=/var/log/traefik/access.log
      - --accesslog.format=json
    ports:
      - "3100:80"
      - "${WEBSECURE_PORT}:443"
      - "3080:8080"
      - "10052:10052"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./conf/certificates:/certificates:ro
      - ./conf/traefik/config:/etc/traefik/config:ro
      - traefik_data:/etc/traefik
      - ./logs/traefik:/var/log/traefik
    networks:
      - internal
      - default
    extra_hosts:
      - "${HOST}:host-gateway"

  keycloak:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/keycloak:2.0.0.296
    logging: *default-logging
    restart: unless-stopped
    command: ["start"]
    environment:
      # Keycloak 基础配置
      - KC_LOG_LEVEL=INFO
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET=${KEYCLOAK_SERVICE_ACCOUNT_CLIENT_SECRET}
      - KC_HTTPS_CERTIFICATE_FILE=/certificates/dev.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/certificates/dev.key
      - KC_PROXY=edge
      - KC_PROXY_ADDRESS_FORWARDING=true
      - KC_HTTP_RELATIVE_PATH=${CONTEXT_PATH:-}/idm
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTPS_CERTIFICATE_KEYSTORE_FILE=/certificates/dev.jks
      - KC_HTTPS_CERTIFICATE_KEYSTORE_PASSWORD=changeit
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_REQUEST=always
      - KC_METRICS_ENABLED=true
      # Keycloak 数据库配置
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/hyo_keycloak
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}

      # Keycloak 应用配置
      - ALLOWED_HOSTS=${HOST}
      - KEYCLOAK_URL=https://${HOST}:${WEBSECURE_PORT}${CONTEXT_PATH:-}/idm
      - KC_HOSTNAME_URL=https://${HOST}:${WEBSECURE_PORT}${CONTEXT_PATH:-}/idm
      # KC_HOSTNAME_PORT 故意不设置：KC_HOSTNAME_URL 已带端口（:${WEBSECURE_PORT}）并完整钉住
      # hostname+port。Keycloak 规范化时省略 https 默认端口 443，保留非默认端口（如 4443）——
      # 与浏览器 origin / jwt.ts issuer（portSuffixFor 同义逻辑）一致 → 避免 invalid redirect_uri。
      # 端口随 traefik "${WEBSECURE_PORT}:443" 绑定，真正支持任意对外端口。
      - KC_SPI_THEME_FOLDER_DIR=/opt/keycloak/themes
      - KC_SPI_THEME_STATIC_MAX_AGE=-1
      - KC_SPI_THEME_CACHE_THEMES=false
      - KC_SPI_THEME_CACHE_TEMPLATES=false
    volumes:
      - ./conf/certificates:/certificates
      - ./conf/keycloak/themes/antd:/opt/keycloak/themes/antd
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`${CONTEXT_PATH:-}/idm`)"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8443"
      - "traefik.http.services.keycloak.loadbalancer.server.scheme=https"
      - "traefik.http.services.keycloak.loadbalancer.passhostheader=true"
    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"

  forwardauth:
    image: swr.cn-east-3.myhuaweicloud.com/hyo-tech/itom/forwardauth:2.0.0.296
    logging: *default-logging
    restart: unless-stopped
    environment:
      - PORT=4181
      - REDIS_URL=redis://redis:6379
      - COOKIE_SECRET=${FORWARDAUTH_COOKIE_SECRET}
      - COOKIE_DOMAIN=${HOST}
      - COOKIE_NAME=_forwardauth
      - COOKIE_PATH=${CONTEXT_PATH:-/}
      - COOKIE_SAMESITE=lax
      - ENCRYPTION_KEY=${FORWARDAUTH_ENCRYPTION_KEY}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID}
      - HOST=${HOST}
      - WEBSECURE_PORT=${WEBSECURE_PORT}
      - CONTEXT_PATH=${CONTEXT_PATH:-}
      # keycloakExternalUrl 由 forwardauth 代码按 portSuffix() 计算规范 origin（443 省略、4443 等非默认保留），
      # 不在此用 KEYCLOAK_EXTERNAL_URL 覆盖——否则 :${WEBSECURE_PORT} 在 443 会注入显式 :443，
      # 绕过代码的默认端口省略，使 OIDC redirect_uri 带 :443 → Keycloak 报 Invalid redirect_uri。
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - SESSION_EXPIRY=1800
      - SESSION_REFRESH_THRESHOLD=240
      - OIDC_CACHE_TTL=300
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forwardauth.rule=PathPrefix(`${CONTEXT_PATH:-}/auth`)"
      - "traefik.http.routers.forwardauth.entrypoints=websecure"
      - "traefik.http.routers.forwardauth.tls=true"
      - "traefik.http.middlewares.strip-context-path.stripprefix.prefixes=${CONTEXT_PATH:-}"
      - "traefik.http.routers.forwardauth.middlewares=strip-context-path"
      - "traefik.http.middlewares.oauth2-proxy.forwardauth.address=http://forwardauth:4181/"
      - "traefik.http.services.forwardauth.loadbalancer.server.port=4181"
      - "traefik.http.services.forwardauth.loadbalancer.server.scheme=http"
      - "traefik.http.middlewares.oauth2-proxy.forwardauth.authResponseHeaders=X-Auth-Request-Access-Token,Authorization,Set-Cookie"
      - "traefik.http.middlewares.oauth2-proxy.forwardauth.addAuthCookiesToResponse=_forwardauth,_forwardauth_csrf"
      - "traefik.http.middlewares.oauth2-proxy.forwardauth.trustForwardHeader=true"
    depends_on:
      - keycloak
      - redis
    networks:
      - internal
    extra_hosts:
      - "${HOST}:host-gateway"

networks:
  internal:
    name: cmdb_internal

volumes:
  data:
  redis_data:
  postgres_data:
  nats_data:
  traefik_data:
  ci-export-data:
